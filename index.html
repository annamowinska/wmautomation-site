<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#242424">
  <title>WM Automation — strona w budowie</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: #242424; color: #f3f3f3; font-family: Arial, Helvetica, sans-serif; text-align: center; }
    main { width: min(100%, 720px); }
    .logo { display: block; width: min(400px, 82vw); height: auto; margin: 0 auto 38px; }
    .rule { width: 72px; height: 2px; background: #38b6ff; margin: 0 auto 28px; }
    h1 { margin: 0 0 14px; font-size: clamp(28px, 6vw, 42px); letter-spacing: .02em; }
    p { margin: 0; color: #c7c7c7; font-size: clamp(16px, 3vw, 19px); line-height: 1.6; }
    .contact { margin-top: 34px; font-size: 15px; }
    a { color: #38b6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 44px; color: #888; font-size: 12px; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="WM Automation">
    <div class="rule" aria-hidden="true"></div>
    <h1>Strona w budowie</h1>
    <p>Pracujemy nad nową witryną.<br>Wkrótce wracamy!</p>
    <p class="contact"><a href="mailto:waldemar.mowinski@wmautomation.eu">waldemar.mowinski@wmautomation.eu</a></p>
    <footer>WM AUTOMATION · PLC PROGRAMMER</footer>
  </main>
</body>
</html>
